# MoveIt Servo Configuration for Kinova Gen3

## Properties of incoming commands
command_in_type: "unitless" # "unitless" or "speed_units"
scale:
  # REDUCED scale parameters for smoother control
  linear: 0.5   # Reduced from 0.4
  rotational: 0.6 # Reduced from 0.8
  joint: 0.6    # Reduced from 0.5

# FIXED: Change to std_msgs/Float64MultiArray for servo bridge
command_out_type: std_msgs/Float64MultiArray

# IMPROVED: Faster publishing for smoother control
publish_period: 0.02  # 50Hz instead of ~30Hz

# What part of the robot to move?
move_group_name: arm  # Often 'manipulator' or 'arm'

# CORRECTED FRAME NAMES FOR KINOVA GEN3
planning_frame: base_link      # The MoveIt planning frame - base_link for Kinova
ee_frame_name: end_effector_link  # The name of the end effector link - end_effector_link for Kinova
robot_link_command_frame: base_link  # commands must be given in the frame of a robot link

## Stopping behaviour - IMPROVED for better responsiveness
incoming_command_timeout: 0.2  # Reduced timeout for faster stopping
num_outgoing_halt_msgs_to_publish: 6  # More halt messages

## Configure handling of singularities and joint limits
lower_singularity_threshold: 17.0  # Start decelerating when the condition number hits this
hard_stop_singularity_threshold: 30.0 # Stop when the condition number hits this
joint_limit_margin: 0.1 # added as a buffer to joint limits [radians]

## Topic names - NOTE: joint_topic will be remapped by launch file
cartesian_command_in_topic: /servo_server/delta_twist_cmds  # Topic for Cartesian twist commands
joint_command_in_topic: /servo_server/delta_joint_cmds # Topic for joint angle commands
joint_topic: joint_states  # This will be remapped to /my_gen3/joint_states by launch file
status_topic: /servo_server/status # Publish status to this topic

# FIXED: Publish to bridge topic instead of directly to robot
command_out_topic: /servo_server/command

## Collision checking for the entire robot body
check_collisions: false # Disable collision checking for now to avoid complexity
collision_check_rate: 10.0 # [Hz]
collision_check_type: threshold_distance

# Parameters for collision checking
self_collision_proximity_threshold: 0.01 
scene_collision_proximity_threshold: 0.02

collision_distance_safety_factor: 1000.0
min_allowable_collision_distance: 0.01

## REQUIRED PARAMETERS
low_pass_filter_coeff: 5.0  # INCREASED for smoother filtering
use_gazebo: false  # Whether running in Gazebo simulation

# FIXED: Choose ONLY velocities when using std_msgs/Float64MultiArray
publish_joint_positions: false  # Must be false when using Float64MultiArray for velocities
publish_joint_velocities: true  # Publish joint velocities only
publish_joint_accelerations: false  # Publish joint accelerations

low_latency_mode: true  # ENABLED for faster response

# KINOVA GEN3 JOINT LIMITS (based on your URDF)
joint_limits:
  has_velocity_limits: true
  max_velocity: 1.2  # REDUCED from 1.3963 for smoother control
  has_acceleration_limits: false
  max_acceleration: 5.0  # rad/s^2 - reasonable default